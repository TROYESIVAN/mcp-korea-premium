[project]
name = "chainpulse-korea"
version = "0.1.0"
description = "MCP server exposing free Korea market microstructure data (Upbit/Bithumb premiums, caution flags, listing changes) to AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ChainPulse" }]
dependencies = ["mcp>=1.2.0,<2"]

[project.scripts]
chainpulse-korea = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
